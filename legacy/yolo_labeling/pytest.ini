[pytest]
# This file exists so pytest picks THIS directory as rootdir instead of the repo
# root. The repo's pyproject.toml sets `--doctest-modules` and tests/conftest.py
# imports torch in pytest_sessionstart -- neither should apply here.
testpaths = tests
# Makes `import yolo_labeling` work in place, but only while this directory is
# itself named `yolo_labeling`. A standalone checkout named anything else gets
# the import from `pip install -e .` instead (see pyproject.toml).
pythonpath = ..
addopts = -q --strict-markers -m "not gui"
markers =
    gui: requires a display; run with `xvfb-run -a pytest -m gui`
    legacy: characterization tests first written against the pre-refactor monolith
